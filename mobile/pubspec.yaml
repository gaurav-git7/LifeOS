name: lifeos
description: "LifeOS: tasks, goals, habits, learning and journal with an AI assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  dio: ^5.11.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  shared_preferences: ^2.5.5
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#07070B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  min_sdk_android: 21

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#07070B"
  image: assets/icon/splash.png
  android_12:
    color: "#07070B"
    image: assets/icon/icon_foreground.png
    icon_background_color: "#07070B"
  ios: false
  web: false
