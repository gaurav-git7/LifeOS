name: release-apk

# Push a tag like v0.1.0 (or run it by hand) to build a signed APK and attach it
# to a GitHub Release. Repository secrets (see docs/RELEASE.md):
#   required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   optional: GOOGLE_SERVICES_JSON_BASE64 (server push in the APK)
#             LIFEOS_API_URL + LIFEOS_JOB_SECRET (send "update available" to everyone's phone)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see docs/RELEASE.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifeos-release.jks"
          echo "LIFEOS_KEYSTORE_PATH=$RUNNER_TEMP/lifeos-release.jks" >> "$GITHUB_ENV"

      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: this APK won't receive server push"
          fi

      - name: Version from tag
        run: |
          # v0.2.1 → name 0.2.1, build number = run number (always increases)
          NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then NAME="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')"; fi
          echo "BUILD_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          LIFEOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFEOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFEOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # One APK for every phone, plus a smaller arm64 one (Galaxy S23 FE and most phones today).
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "build/LifeOS-$BUILD_NAME.apk"
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/LifeOS-$BUILD_NAME-arm64.apk"
          rm -f "$RUNNER_TEMP/lifeos-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-${{ env.BUILD_NAME }}
          path: mobile/build/LifeOS-*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/LifeOS-*.apk
          generate_release_notes: true

      - name: Tell phones an update is out
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          API_URL: ${{ secrets.LIFEOS_API_URL }}
          JOB_SECRET: ${{ secrets.LIFEOS_JOB_SECRET }}
        working-directory: .
        run: |
          if [ -z "$API_URL" ] || [ -z "$JOB_SECRET" ]; then
            echo "::warning::LIFEOS_API_URL / LIFEOS_JOB_SECRET not set: no update notification sent"; exit 0
          fi
          URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          # The free server may be asleep: give it time to wake up.
          curl -fsS --retry 4 --retry-delay 20 --max-time 90 -X POST "$API_URL/internal/jobs/announce-release"             -H "X-Job-Secret: $JOB_SECRET" -H "Content-Type: application/json"             -d "{\"version\": \"$BUILD_NAME\", \"url\": \"$URL\"}"
