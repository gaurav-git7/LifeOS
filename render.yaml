# Render Blueprint — free web service for the LifeOS API.
# In Render: New → Blueprint → connect this repo. Secrets marked sync:false
# are entered in the dashboard (never committed). See docs/SETUP.md.
services:
  - type: web
    name: lifeos-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: REGISTRATION_MODE
        value: invite
      - key: DB_SCHEMA
        value: app
      # Email via Gmail SMTP (needs 2-Step Verification + an App password).
      # User, password and From address are entered in the Render dashboard (sync: false below).
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: AI_DAILY_BUDGET_USD
        value: "0.10"
      - key: GEMINI_MODEL_LITE
        value: gemini-2.5-flash-lite
      - key: GEMINI_MODEL_DEFAULT
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_PRO
        value: gemini-2.5-pro
      - key: JWT_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SMTP_USER         # your Gmail address, e.g. you@gmail.com
        sync: false
      - key: SMTP_PASSWORD     # the 16-character Gmail App password (NOT your normal password)
        sync: false
      - key: EMAIL_FROM        # e.g. LifeOS <you@gmail.com> — must be the same Gmail address
        sync: false
