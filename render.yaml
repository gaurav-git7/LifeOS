# Render Blueprint — free web service for the LifeOS API.
# In Render: New → Blueprint → connect this repo. Secrets marked sync:false
# are entered in the dashboard (never committed). See docs/SETUP.md.
services:
  - type: web
    name: lifeos-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: REGISTRATION_MODE
        value: invite
      - key: DB_SCHEMA
        value: app
      # Email via Resend's HTTPS API. (Render's free plan blocks outgoing SMTP
      # ports 25/465/587, so Gmail SMTP can't connect from here.)
      # Without a verified domain, Resend only delivers to your Resend account email.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: LifeOS <onboarding@resend.dev>
      - key: AI_DAILY_BUDGET_USD
        value: "0.10"
      - key: GEMINI_MODEL_LITE
        value: gemini-2.5-flash-lite
      - key: GEMINI_MODEL_DEFAULT
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_PRO
        value: gemini-2.5-pro
      - key: JWT_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: RESEND_API_KEY    # from resend.com → API Keys (starts with re_)
        sync: false
